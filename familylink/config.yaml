name: "Google Family Link Bridge"
description: "MQTT bridge for Google Family Link screen time tracking and device management"
version: "1.3.2"
slug: "familylink_bridge"
url: "https://github.com/sv01a/familylink-hass-addon/tree/main/familylink"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  poll_interval: 300
  google_email: ""
  master_token: ""
  android_id: ""
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  poll_interval: int
  google_email: str?
  master_token: password?
  android_id: str?

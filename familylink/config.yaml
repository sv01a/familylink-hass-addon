name: "Google Family Link Bridge"
description: "MQTT мост для управления устройствами и получения статистики Google Family Link в Home Assistant"
version: "1.0.0"
slug: "familylink_bridge"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  poll_interval: 300
  cookies_text: ""
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  poll_interval: int
  cookies_text: text?
